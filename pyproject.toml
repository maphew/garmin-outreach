[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "garmin-outreach"
version = "0.1.0"
description = "Idempotent Garmin inReach/Explore exports for GIS"
readme = "Readme.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Garmin Outreach contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "geopandas>=1.0,<2",
  "httpx>=0.27,<1",
  "pyogrio>=0.9,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.46,<2", "rookiepy>=0.5,<1"]
ui = [
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "datastar-py>=1.0.2,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "datastar-py>=1.0.2,<2",
]

[project.scripts]
garmin-outreach = "garmin_outreach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_outreach"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
